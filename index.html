<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suscripción al Boletín Oficial</title>
  
  <!-- Fuente Montserrat de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- SDK oficial de EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #4f46e5, #7c3aed, #06b6d4, #2563eb);
      background-size: 400% 400%;
      animation: gradientMove 10s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* CONTENEDOR PRINCIPAL DE LA PÁGINA (ESTRUCTURA DE 5 SECCIONES) */
    .page-container {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      width: 90%;
      max-width: 520px;
      margin: 30px 0;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    /* SECCIÓN 1: HEADER / LOGO */
    .sec-header {
      background: linear-gradient(-45deg, #4f46e5, #7c3aed, #06b6d4);
      background-size: 300% 300%;
      animation: gradientMove 5s ease infinite;
      padding: 22px;
      text-align: center;
    }
    .sec-header h1 {
      color: #ffffff;
      margin: 0;
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* SECCIÓN 2: SALUDO / HERO */
    .sec-hero {
      padding: 30px 30px 10px 30px;
      text-align: center;
    }
    .sec-hero h2 {
      margin: 0;
      color: #111827;
      font-size: 22px;
      font-weight: 700;
    }

    /* SECCIÓN 3: CONTENIDO / INFORMACIÓN */
    .sec-content {
      padding: 10px 30px 20px 30px;
      text-align: center;
    }
    .sec-content p {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    /* SECCIÓN 4: FORMULARIO CTA (UN SOLO CAMPO EMAIL) */
    .sec-cta {
      padding: 10px 30px 30px 30px;
      text-align: center;
    }
    input[type="email"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="email"]:focus {
      border-color: #4f46e5;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(-45deg, #4f46e5, #7c3aed, #06b6d4, #4f46e5);
      background-size: 300% 300%;
      animation: gradientMove 5s ease infinite;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
    }
    #message {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    /* SECCIÓN 5: FOOTER */
    .sec-footer {
      background-color: #f9fafb;
      padding: 18px 20px;
      text-align: center;
      border-top: 1px solid #e5e7eb;
    }
    .sec-footer p {
      color: #9ca3af;
      font-size: 12px;
      margin: 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- SECCIÓN 1: HEADER / LOGO -->
    <header class="sec-header">
      <h1>BOLETÍN OFICIAL</h1>
    </header>

    <!-- SECCIÓN 2: SALUDO / HERO -->
    <section class="sec-hero">
      <h2>¡Te damos la bienvenida!</h2>
    </section>

    <!-- SECCIÓN 3: CONTENIDO -->
    <section class="sec-content">
      <p>Recibe directamente en tu bandeja de entrada nuestras novedades, actualizaciones exclusivas y recursos semanales.</p>
    </section>

    <!-- SECCIÓN 4: FORMULARIO CTA (SOLO CAMPO EMAIL) -->
    <section class="sec-cta">
      <form id="subscribe-form">
        <input type="email" id="user_email" name="user_email" placeholder="Ingresa tu correo electrónico" required>
        <button type="submit" id="btn-submit">Suscribirme ahora</button>
      </form>
      <div id="message"></div>
    </section>

    <!-- SECCIÓN 5: FOOTER -->
    <footer class="sec-footer">
      <p>© 2026 Tu Aplicación. Todos los derechos reservados.<br>Política de Privacidad | Términos de Servicio</p>
    </footer>

  </div>

  <script>
    // Reemplaza estas constantes con tus datos de EmailJS
    const PUBLIC_KEY = "TU_PUBLIC_KEY_AQUI";
    const SERVICE_ID = "TU_SERVICE_ID_AQUI";
    const TEMPLATE_ID = "TU_TEMPLATE_ID_AQUI";

    emailjs.init(PUBLIC_KEY);

    document.getElementById('subscribe-form').addEventListener('submit', function(event) {
      event.preventDefault();
      
      const btn = document.getElementById('btn-submit');
      const messageDiv = document.getElementById('message');
      
      btn.innerText = 'Enviando...';
      btn.disabled = true;

      emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, this)
        .then(() => {
          btn.innerText = 'Suscribirme ahora';
          btn.disabled = false;
          messageDiv.style.color = '#16a34a';
          messageDiv.innerText = '¡Suscripción exitosa! Revisa tu correo.';
          this.reset();
        }, (error) => {
          btn.innerText = 'Suscribirme ahora';
          btn.disabled = false;
          messageDiv.style.color = '#dc2626';
          messageDiv.innerText = 'Error al enviar el correo.';
          console.error('EmailJS Error:', error);
        });
    });
  </script>

</body>
</html>
